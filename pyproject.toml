[project]
name = "maya-mcp"
version = "0.1.0"
description = "MCP server for AI-driven 3D modeling in Autodesk Maya"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "pydantic>=2",
    "pillow>=10",
    "httpx>=0.27",
]

[project.scripts]
maya-mcp = "maya_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maya_mcp", "maya_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
